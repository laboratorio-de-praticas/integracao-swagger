get:
  tags:
  - CMS - Produtos
  summary: Listar todos os projetos
  description: |
    🔐 **Rota protegida. Requer autenticação com JWT.**

    Para acessar esta rota, clique em **Authorize** no topo da página e insira o token JWT no formato:

    ```
    Authorization: Bearer seu_token_jwt_aqui
    ```

    Após autorizado, esta rota poderá ser testada normalmente.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Lista de projetos recuperada com sucesso
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '../../../components/schemas.yaml#/ProjetoCriadoResponse'
    '401':
      description: Token JWT ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas.yaml#/ErrorResponse'
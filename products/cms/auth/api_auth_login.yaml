post:
  tags:
    - CMS - Auth
  summary: Login para obter token JWT
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              example: admin@fatec.sp.gov.br
            senha:
              type: string
              example: senha123
  responses:
    '200':
      description: Token JWT gerado com sucesso
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              token:
                type: string
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    '401':
      description: Credenciais inválidas
      content:
        application/json:
            schema:
            type: object
            properties:
              error:
                type: string
                example: "Dados incorretos"
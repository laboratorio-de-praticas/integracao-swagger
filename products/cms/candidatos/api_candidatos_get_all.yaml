get:
  summary: Lista todos os candidatos cadastrados
  description: Retorna uma lista com todos os candidatos e seus respectivos dados de cadastro.
  tags:
    - CMS - Candidatos
  responses:
    "200":
      description: Lista de candidatos retornada com sucesso
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: "../../../components/schemas.yaml#/Candidato"
          example:
            success: true
            data:
              - id: 1
                ra: "123456789"
                nome: "João Silva"
                email_institucional: "joao.silva@fatec.sp.gov.br"
                telefone: "(11) 99999-9999"
                turma_atual: "DSM4"
                foto_url: "/imgs/candidatos/123456789.jpg"
                deseja_ser_candidato: true
                link_video: "https://youtube.com/..."
                descricao_campanha: "Minha proposta de campanha..."
                curso: "Desenvolvimento de Software Multiplataforma"
                semestre: "4"
                ano_ingresso: "2022"
                status_candidatura: "pendente"
                created_at: "2024-04-03T10:00:00Z"
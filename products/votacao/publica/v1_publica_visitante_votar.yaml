post:
  operationId: PublicaController_votarVisitante
  summary: 'Registrar voto do visitante'
  tags:
    - 'Votação Pública'
  requestBody:
    description: 'Dados necessários para registrar um voto'
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            id_visitante:
              type: number
              example: 1
            id_projeto:
              type: number
              example: 10
            id_evento:
              type: number
              example: 100
          required:
            - id_visitante
            - id_projeto
            - id_evento
  responses:
    '201':
      description: 'Voto registrado com sucesso.'
    '400':
      description: 'Erro na validação dos dados.'
post:
  operationId: PublicaController_classificarProjeto
  summary: 'Registrar classificação de um projeto'
  tags:
    - 'Votação Pública'
  requestBody:
    description: 'Dados necessários para registrar a classificação'
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            id_avaliador:
              type: number
              example: 2
            id_projeto:
              type: number
              example: 2
            id_evento:
              type: number
              example: 2
            estrelas_inovador:
              type: number
              minimum: 1
              maximum: 5
              example: 4
            estrelas_acolhedor:
              type: number
              minimum: 1
              maximum: 5
              example: 4
            comentario:
              type: string
              example: 'Ótimo projeto!'
          required:
            - id_avaliador
            - id_projeto
            - id_evento
            - estrelas_inovador
            - estrelas_acolhedor
  responses:
    '201':
      description: 'Classificação registrada com sucesso.'
    '400':
      description: 'Erro na validação dos dados.'
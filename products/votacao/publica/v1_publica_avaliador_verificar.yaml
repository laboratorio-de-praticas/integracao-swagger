get:
  operationId: PublicaController_verificarAvaliador
  summary: 'Verificar se o avaliador pode votar no evento'
  tags:
    - 'Votação Pública'
  parameters:
    - name: idAvaliador
      in: path
      required: true
      description: 'ID do avaliador'
      schema:
        type: number
        example: 2
    - name: idProjeto
      in: path
      required: true
      description: 'ID do projeto'
      schema:
        type: number
        example: 10
    - name: idEvento
      in: path
      required: true
      description: 'ID do evento'
      schema:
        type: number
        example: 100
  responses:
    '200':
      description: 'Status do voto retornado com sucesso.'
    '400':
      description: 'Parâmetros obrigatórios ausentes ou inválidos.'
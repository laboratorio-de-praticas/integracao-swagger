get:
  operationId: PublicaController_verificarVisitante
  summary: 'Verificar se o visitante pode votar no evento'
  tags:
    - 'Votação Pública'
  parameters:
    - name: idVisitante
      in: path
      required: true
      description: 'ID do visitante'
      schema:
        type: number
        example: 1
    - name: idProjeto
      in: path
      required: true
      description: 'ID do projeto'
      schema:
        type: number
        example: 10
    - name: idEvento
      in: path
      required: true
      description: 'ID do evento'
      schema:
        type: number
        example: 100
  responses:
    '200':
      description: 'Status do voto retornado com sucesso.'
    '400':
      description: 'Parâmetros obrigatórios ausentes ou inválidos.'
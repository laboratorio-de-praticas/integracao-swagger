Representante:
  type: object
  properties:
    id:
      type: string
      example: "12345"
    nome:
      type: string
      example: "João Silva"
    cargo:
      type: string
      example: "Presidente da turma"

PaginaCMS:
  type: object
  properties:
    id:
      type: string
      example: "abc123"
    titulo:
      type: string
      example: "Página Inicial"
    conteudo:
      type: string
      example: "<p>Bem-vindo ao site!</p>"

Dashboard:
  type: object
  properties:
    id:
      type: string
      example: "dash01"
    titulo:
      type: string
      example: "Dashboard de Acessos"
    criado_em:
      type: string
      format: date-time
      example: "2025-01-01T12:00:00Z"

Eleicao:
  type: object
  properties:
    id:
      type: string
      example: "el123"
    titulo:
      type: string
      example: "Eleição para representante"
    status:
      type: string
      enum: [ativa, encerrada, futura]
      example: "ativa"

Candidato:
  type: object
  properties:
    id:
      type: integer
      example: 1
    ra:
      type: string
      example: "123456789"
    nome:
      type: string
      example: "João Silva"
    email_institucional:
      type: string
      example: "joao.silva@fatec.sp.gov.br"
    telefone:
      type: string
      example: "(11) 99999-9999"
    turma_atual:
      type: string
      example: "DSM4"
    curso:
      type: string
      example: "Desenvolvimento de Software Multiplataforma"
    semestre:
      type: string
      example: "4"
    ano_ingresso:
      type: string
      example: "2022"
    deseja_ser_candidato:
      type: boolean
      example: true
    link_video:
      type: string
      example: "https://youtube.com/..."
    descricao_campanha:
      type: string
      example: "Minha proposta de campanha..."
    foto_url:
      type: string
      example: "/imgs/candidatos/123456789.jpg"
    status_candidatura:
      type: string
      example: "pendente"
    created_at:
      type: string
      format: date-time
      example: "2024-04-03T10:00:00Z"

Integrante:
  type: object
  properties:
    nome:
      type: string
      example: João Silva
    funcao:
      type: string
      example: Desenvolvedor Backend

ODS:
  type: object
  properties:
    id:
      type: integer
      example: 1
    nome:
      type: string
      example: ODS 1 - Erradicação da Pobreza

LinhaExtensao:
  type: object
  properties:
    id:
      type: integer
      example: 1
    nome:
      type: string
      example: Tecnologia e Inovação

AreaTematica:
  type: object
  properties:
    id:
      type: integer
      example: 1
    nome:
      type: string
      example: Tecnologia da Informação

ProjetoCriadoResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: Projeto criado com sucesso
    data:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome_Projeto:
          type: string
          example: Sistema de Gestão Escolar
        nome_equipe:
          type: string
          example: Equipe Alpha
        descricao:
          type: string
          example: Sistema para gerenciamento de atividades escolares
        turma:
          type: string
          example: DSM4
        tlr:
          type: string
          example: "1"
        cea:
          type: string
          example: "1"
        area_atuacao:
          type: string
          example: Educação
        imagem_capa:
          type: string
          example: /imgs/projetos/capas/123456789.jpg
        imagens_projeto:
          type: array
          items:
            type: string
            example: /imgs/projetos/Imagens_Projeto/987654321.jpg
        ods:
          type: array
          items:
            $ref: '#ODS'
        linhas_extensao:
          type: array
          items:
            $ref: '#LinhaExtensao'
        areas_tematicas:
          type: array
          items:
            $ref: '#AreaTematica'
        integrantes:
          type: array
          items:
            $ref: '#Integrante'
        status:
          type: string
          example: ativo
        created_at:
          type: string
          format: date
          example: 2024-04-03T10:00:00Z

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: Token inválido ou dados ausentes

ProjetoAtivo:
  type: object
  properties:
    id:
      type: integer
      example: 1
    nome_Projeto:
      type: string
      example: Sistema de Gestão Escolar
    nome_equipe:
      type: string
      example: Equipe Alpha
    descricao:
      type: string
      example: Sistema para gerenciamento de atividades escolares
    turma:
      type: string
      example: DSM4
    tlr:
      type: string
      example: "1"
    cea:
      type: string
      example: "1"
    area_atuacao:
      type: string
      example: Educação
    imagem_capa:
      type: string
      example: /imgs/projetos/capas/123456789.jpg
    imagens_projeto:
      type: array
      items:
        type: string
        example: /imgs/projetos/Imagens_Projeto/987654321.jpg
    status:
      type: string
      example: ativo
    created_at:
      type: string
      format: date-time
      example: "2024-04-03T10:00:00Z"
      
UserLoginRequestDto:
  type: object
  properties:
    email:
      type: string
      description: E-mail do usuário para autenticação.
      example: usuario@dominio.com
    password:
      type: string
      description: Senha do usuário para autenticação.
      example: senhaSuperSecreta123
  required:
    - email
    - password

UserLoginResponseDto:
  type: object
  properties:
    access_token:
      type: string
      description: Token de acesso que será utilizado em outras rotas
      example: >-
        eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImxlYWxAbGVhbC5jb20iLCJpZCI6MSwiaWF0IjoxNzQyNDA2NzE0LCJleHAiOjE3NDI0MTAzMTR9.YQq5lZqzHExWPluyxyyMQdRtMyWzBT3p03_ibzuJkQ0
  required:
    - access_token

ExternalUserLoginRequestDto:
  type: object
  properties:
    chave_acesso:
      type: string
      description: Chave de acesso do visitante.
      example: "1234"
  required:
    - chave_acesso

UserCreateRequestDto:
  type: object
  properties:
    nome:
      type: string
      description: Nome do usuário
      example: João Silva
    email_institucional:
      type: string
      description: E-mail do usuário.
      example: usuario@fatec.sp.gov.br
    senha:
      type: string
      description: Senha.
      example: eng.u1i231ca
  required:
    - nome
    - email_institucional
    - senha

UserCreateResponseDto:
  type: object
  properties:
    id:
      type: number
      description: ID do usuário recem criado.
      example: 13
    message:
      type: string
      description: Mensagem de sucesso...ou não.
      example: Usuário criado com sucesso.
  required:
    - id
    - message

UserUpdateRequestDto:
  type: object
  properties:
    nome:
      type: string
      description: Novo nome do usuário.
      example: João Silva
    email_institucional:
      type: string
      description: Novo e-mail do usuário.
      example: novoemail@exemplo.com
    senha:
      type: string
      description: Nova senha do usuário.
      example: novasenha123
    tipo_usuario:
      type: string
      description: Novo tipo de usuário.
      enum:
        - Admin
        - Atendente
      example: Admin
    status_usuario:
      type: string
      description: Novo tipo de usuário.
      enum:
        - Pendente
        - Ativo
        - Desligado
      example: Ativo

UserUpdateResponseDto:
  type: object
  properties:
    id:
      type: number
      description: ID do usuário atualizado.
      example: 13
    message:
      type: string
      description: Mensagem de sucesso.
      example: Usuário atualizado com sucesso.
  required:
    - id
    - message

ExternalUserCreateRequestDto:
  type: object
  properties:
    nome:
      type: string
      description: Nome do visitante
      example: Davi da Silva
    telefone:
      type: string
      description: Telefone do visitante
      example: "1399675432321"
  required:
    - nome
    - telefone

ExternalUserCreateResponseDto:
  type: object
  properties:
    chave_acesso:
      type: string
      description: Chave de acesso do visitante.
      example: "1234"
    message:
      type: string
      description: Mensagem de sucesso...ou não.
      example: Cadastro do visitante realizado com sucesso.
  required:
    - chave_acesso
    - message

Evento:
  type: object
  properties:
    id_evento:
      type: integer
      example: 1
    nome_evento:
      type: string
      example: Evento Teste
    tipo_evento:
      type: string
      enum: [INTERNO, EXTERNO]  # Adjust based on TipoEvento enum
      example: INTERNO
    descricao_evento:
      type: string
      example: Descrição do evento
    status_evento:
      type: string
      enum: [ATIVO, INATIVO]  # Adjust based on StatusEvento enum
      example: ATIVO
    curso_semestre:
      type: string
      example: DSM1
    data_alteracao:
      type: string
      format: date-time
      example: "2025-05-05T10:00:00Z"
    data_criacao:
      type: string
      format: date-time
      example: "2025-05-01T09:00:00Z"
    data_inicio:
      type: string
      format: date-time
      example: "2025-05-10T08:00:00Z"
    data_fim:
      type: string
      format: date-time
      example: "2025-05-10T17:00:00Z"
    representantes:
      type: array
      items:
        type: object  # Define detailed schema if you have one
      example: []
    projetosEventos:
      type: array
      items:
        type: object  # Define detailed schema if you have one
      example: []